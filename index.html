<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- constants (SI units: metres, seconds) ----------
const G = 9.81;
const ROAD_HALF = 3.0;          // this level: one narrow street, 6 m wide all the way
const RH = z => ROAD_HALF;
const ROAD_MAX = ROAD_HALF;
const FRONT = 0.6;   // strip between the road edge and the building fronts, packed with shop clutter
// side alleys: openings in both walls where people come out and cross to the alley opposite
// Every opening is random: spacing, width, depth, which side(s), and how it lines up with the one opposite.
const PERIOD=1302, ZS=-110;      // the street is built for [ZS, ZS+PERIOD) and repeats seamlessly after that
const KERB=[], SEATS=[], WALL_OCC=new Set();   // WALL_OCC: wall spots with something sticking out at first-floor height
const OPENINGS=[], IDLERS=[], WIRES=[], SMOKE_STATIC=[];
for(let az=ZS+15+Math.random()*20; az<ZS+PERIOD-12; az+= 18+Math.random()*60){
  const both=Math.random()<0.6, s0=Math.random()<.5?-1:1;
  for(const side of both?[-1,1]:[s0])
    OPENINGS.push({z: az + (both? (Math.random()-0.5)*3 : 0), w: 2.2+Math.random()*2.4, side, depth: 5+Math.random()*7});
}
const _aw = z => z>=ZS+PERIOD-10 ? z-PERIOD : z;   // past the built stretch, the street repeats
const alleyAt = (z,side,m=0) => { z=_aw(z); return OPENINGS.find(a=>a.side===side && Math.abs(a.z-z) < a.w/2+m); };
const nearAlley = (z,m=0) => { z=_aw(z); return OPENINGS.some(a=>Math.abs(a.z-z) < a.w/2+m); };
const oppositeOf = a => OPENINGS.find(b=>b.side===-a.side && Math.abs(b.z-a.z)<3);
const SHOP_Z = PERIOD-80;            // length of the street (no finish line: deliver to people and earn)
const START_LOAVES = 50;
const MAX_GRIP = 0.8 * G;       // max lateral accel the tyres allow
// ==================== TUNING TABLE ====================
// Every number that decides how hard or easy the level plays, in one place. The auto-balancer (and you)
// change these; nothing else in the file needs touching. window.__TUNE can override any of them.
const TUNE = Object.assign({
  // riding
  cruise: 7.5,            // m/s you settle at with no input (27 km/h)
  topSpeed: 22,           // m/s flat out (79 km/h)
  // losing bread
  spillForce: 2.6,        // sideways force (m/s²) before loaves start sliding off
  spillPerLoaf: 0.33,     // how much hard swerving costs one loaf (higher = gentler)
  crashSpeed: 9,          // m/s impact that's a full crash rather than a bump
  hitLoss: 0.6,           // share of the tray a bump just under crash speed knocks off
  peopleHitShare: 0.35,   // bumping a person costs this share of hitting a thing
  catLoss: [1,3,5,7,10],  // loaves lost hitting a cat, by speed band (<15, <30, <45, <60, 60+ km/h)
  roadBumpLoss: 0.5,      // drain covers and manholes (only above normal speed)
  roadBumpEvery: [38,58], // metres between them
  // the bell
  bellRadius: 9.5,        // metres around you
  bellAhead: 0.35,        // extra reach ahead per m/s of speed

// legs that really pedal: two-bone IK (thigh + shin) from the hip to a pedal going round the crank
function makePedaller(parent, pants, shoe=0x222222, crankParent=parent){
  const HIP_Y=0.98, HIP_Z=-0.27, CR_Y=0.36, CR_Z=0.02, CR=0.17, L1=0.46, L2=0.5;
  const legs=[], cranks=[];
  for(const sd of [-1,1]){
    const thigh=new THREE.Group(); thigh.position.set(sd*0.12,HIP_Y,HIP_Z); parent.add(thigh);
    thigh.add(mergeParts([B(0.15,L1,0.17, 0,-L1/2,0, pants)]));
    const knee=new THREE.Group(); knee.position.y=-L1; thigh.add(knee);
    knee.add(mergeParts([B(0.14,0.12,0.15, 0,0,0.01, pants), B(0.13,L2*0.55,0.15, 0,-L2*0.28,-0.01, pants), B(0.105,L2*0.5,0.11, 0,-L2*0.7,0, pants)]));
    const foot=new THREE.Group(); foot.position.y=-L2+0.04; knee.add(foot);
    foot.add(mergeParts([B(0.09,0.07,0.1, 0,0,0, 0xc68b59), B(0.13,0.07,0.17, 0,-0.03,0.03, shoe)]));
    const toe=new THREE.Group(); toe.position.set(0,-0.04,0.115); foot.add(toe);
    toe.add(mergeParts([B(0.125,0.05,0.08, 0,0,0.035, shoe)]));
    legs.push({thigh,knee,foot,toe,sd});
    const crank=new THREE.Group(); crank.position.set(sd*0.09,CR_Y,CR_Z); crankParent.add(crank);
    crank.add(mergeParts([B(0.03,CR,0.03, 0,-CR/2,0, 0x333333), B(0.1,0.03,0.06, sd*0.04,-CR,0, 0x111111)])); cranks.push(crank);
  }
  const sole=(L,flex=0)=>{ L.foot.rotation.x=-(L.thigh.rotation.x+L.knee.rotation.x)+flex; L.toe.rotation.x=-Math.max(0,flex)*0.8; };
  return { flail(t,k){ legs.forEach((L,i)=>{
      L.thigh.rotation.x=0.15-(0.5+Math.sin(t*9+i*2.4)*0.6)*k; L.thigh.rotation.z=L.sd*0.18*k;
      L.knee.rotation.x=0.1+(0.7+Math.sin(t*12+i*3)*0.6)*k; L.foot.rotation.x=0.35+Math.sin(t*15+i)*0.3*k;
    }); },
    spin(a){ cranks.forEach((c,i)=>{ c.rotation.x=a+i*Math.PI; }); },
    straighten(){ for(const L of legs){ L.thigh.rotation.x=0.15; L.knee.rotation.x=0.1; L.thigh.rotation.z=0; } },
    footPush(k){                                        // k: 0..1 through one shove
      const L=legs[1], down=k<0.55, u=down?k/0.55:(k-0.55)/0.45;
      L.thigh.rotation.x = down ? 0.3-u*0.95 : -0.65+u*0.95;   // foot goes from behind to in front, driving the bike back
      L.thigh.rotation.z = 0.42;
      L.knee.rotation.x = down ? 0.05 : 0.05+Math.sin(u*Math.PI)*0.75;
      sole(L, down ? u*0.4 : 0);
    },
    footDown(){ const L=legs[1]; L.thigh.rotation.x=0.05; L.thigh.rotation.z=0.42; L.knee.rotation.x=0.05; sole(L); },
    update(theta){
    for(let i=0;i<2;i++){
      const a=theta+(i?Math.PI:0), L=legs[i];
      cranks[i].rotation.x = a;
      const pz=CR_Z - Math.sin(a)*CR, py=CR_Y - Math.cos(a)*CR;          // pedal position (same rotation as the crank arm)
      const dz=pz-HIP_Z, dy=py-HIP_Y, d=Math.min(L1+L2-0.01, Math.hypot(dz,dy));
      const toPedal=Math.atan2(dz,-dy);                                    // 0 = straight down, + = forward
      const hip=Math.acos(Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d)));
      const kneeIn=Math.acos(Math.min(1,(L1*L1+L2*L2-d*d)/(2*L1*L2)));
      const thighA=toPedal+hip, shinA=thighA-(Math.PI-kneeIn);            // knee points forward
      L.thigh.rotation.x=-thighA; L.knee.rotation.x=-(shinA-thighA); L.thigh.rotation.z=0; sole(L,Math.sin(a)*0.28);
    }
  }};
}

// Plays the level like a person of a given skill, so the balance can be measured over hundreds of rides.
// Turn it on in the browser with ?bot=beginner | average | good, or window.__BOT.
const BOT_SKILLS={
  //            how often it re-thinks, how well it judges where things will be, how far it looks,
  //            how sharply it steers, safety margin, braking, pedals when clear, bell use, stops for customers

  average: {react:0.28, judge:0.7,  look:1.6, steer:3.2, margin:0.25, brake:0.8, pedal:0.25, bell:0.5,  deliver:0.75, noise:0.15},
  good:    {react:0.16, judge:1,    look:2.2, steer:2.4, margin:0.3,  brake:1,   pedal:0.7,  bell:0.8,  deliver:1, noise:0.05},
};
const BOT=(()=>{ const q=new URLSearchParams(location.search||'').get('bot'); const k=window.__BOT||q; return k&&BOT_SKILLS[k]?{skill:BOT_SKILLS[k], name:k}:null; })();
const botState={thinkT:0, lane:0, braking:false, clearT:0, waitT:0, bellT:0};
function botReset(){ Object.assign(botState,{thinkT:0, lane:0, braking:false, clearT:0, waitT:0, bellT:0}); }
function botDanger(cx, S){
  // how bad would it be to be on line cx over the next couple of seconds
  const v=Math.max(Math.abs(speed),1.5), look=S.look*v+4, R=RH(z);
  if(Math.abs(cx)>R-0.38) return {d:99,t:0};
  let d=0, soonest=9;
  for(const q of obstacles){
    if(q.dead || (q.kind==='cat' && q.state>=2)) continue;
    const p=q.mesh.position, dz=p.z-z;
    if(dz<-1.2 || dz>look) continue;
    const qvz=q.sv?q.sv.z:(q.vz||0), qvx=q.sv?q.sv.x:(q.vx||0);
    const close=Math.max(0.3,speed-qvz), t=Math.max(0,dz-q.hz-0.85)/close;
    const px=p.x+qvx*t*S.judge+(Math.random()-0.5)*S.noise;               // where it'll be when I get there (as I judge it)
    const need=q.hx+0.25+S.margin+(qvz>0 && qvz<speed*0.5 ? 0.25 : 0);
    if(Math.abs(px-cx)<need){ d+=(1+(need-Math.abs(px-cx))*2)/(0.35+t); soonest=Math.min(soonest,t); }
  }
  for(const b of bumps){                                                   // drain covers: worth avoiding if it's cheap
    const dz=b.z-z; if(dz<0||dz>look) continue;
    if(Math.abs(b.x-cx)<b.r) d+=(speed>CRUISE?0.6:0.1)*b.jolt;
  }
  return {d,t:soonest};
}
function botDrive(dt){
  const S=BOT.skill, R=RH(z);
  botState.thinkT-=dt; botState.bellT-=dt;
  // a customer worth stopping for?
  const c=customers.find(c=>c.state==='wait' && c.z-z>-1 && c.z-z<55);
  // watchdog: stuck (not getting anywhere for a few seconds)? give up on whatever it was doing
  botState.lastZ ??= z; botState.stuckT=(z-botState.lastZ>0.5)?0:(botState.stuckT||0)+dt; if(z-botState.lastZ>0.5) botState.lastZ=z;
  if(botState.stuckT>3 && c) c.botWill=false;
  const delivering = c && loaves.length>=1 && (c.botWill ??= Math.random()<S.deliver);
  const bayX = delivering ? c.side*(R-c.type.w/2) : null, bayDz = delivering ? c.z-z : 99;
  if(botState.thinkT<=0){
    botState.thinkT=S.react;
    {
      let best=botState.lane, bestCost=1e9, bestD=null;
      for(let cx=-R+0.4; cx<=R-0.4; cx+=0.25){
        // heading for a customer's bay pulls it toward that side, harder as it gets close, but never through things
        const pull = delivering ? Math.abs(cx-bayX)*(bayDz<20 ? 3 : 0.6) : 0;
        const D=botDanger(cx,S), cost=D.d*10+Math.abs(cx-x)*0.35+Math.abs(cx-botState.lane)*0.15+pull;
        if(cost<bestCost){ bestCost=cost; best=cx; bestD=D; }
      }
      botState.lane=best;
      // can't get clear in time? brake (beginners don't always)
      const shift=Math.abs(best-x), reach=0.25+1.0*bestD.t, here=botDanger(x,S);
      botState.braking = Math.random()<S.brake && ((bestD.d>0.5 && (shift>reach || bestD.t<0.9)) || (here.d>1 && here.t<1.1 && shift>0.4));
      botState.busy = here.d>0.2 || bestD.d>0.2;                                 // traffic close: ride slower
      // ring for people in the way
      if(botState.bellT<=0 && Math.random()<S.bell){
        const inWay=obstacles.some(q=>!q.dead && (q.kind.startsWith('walker')||q.fam||q.kind==='crosser') && q.mesh.position.z-z>2 && q.mesh.position.z-z<9 && Math.abs(q.mesh.position.x-x)<1.2);
        if(inWay){ honk(); botState.bellT=2.5; }
      }
    }
  }
  // steer: a beginner snaps to the new line, a good rider eases over
  const step=S.steer*dt; targetX+=Math.max(-step,Math.min(step,botState.lane-targetX));
  // speed
  let up=false, down=botState.braking;
  const inBayLine = delivering && Math.abs(x-bayX)<c.type.w/2-0.2;
  if(delivering && inBayLine && bayDz<14 && !botState.braking){
    if(bayDz>c.type.l/2-0.6) { down=speed>Math.max(1.2,bayDz*0.5); up=speed<1; }    // roll up to it slowly
    else down=true;                                                                  // stop inside
  } else if(!down){
    botState.clearT = botState.braking||botState.busy ? 0 : botState.clearT+dt;
    const want = botState.busy ? CRUISE*(0.5+0.4*S.judge) : CRUISE;           // ease off in traffic (skilled riders less)
    if(speed<want*0.9) up=true;
    if(speed>want*1.15 && botState.busy) down=true;
    const clearAhead=!obstacles.some(q=>!q.dead && q.mesh.position.z-z>0 && q.mesh.position.z-z<(35-S.judge*12) && Math.abs(q.mesh.position.x-x)<2);
    if(clearAhead && botState.clearT>2.5-S.judge*1.5 && S.pedal>0 && (botState.pedalling ??= Math.random()<S.pedal)) up=speed<MAX_SPEED*0.7;
    if(!clearAhead) botState.pedalling=undefined;
  }
  keys.ArrowUp=up; keys.ArrowDown=down && !(Math.abs(speed)<0.35 && !delivering);   // never pushes backwards
}

let LVN=1; const LV=()=>LEVELS[LVN-1];

function buildStall(side){

  } else {

    for(let i=0;i<3;i++){

const GAP=0.15;  // minimum clearance between any two obstacles (m)
function overlapsAny(o, ignore){
  const p=o.mesh.position;
  for(const q of obstacles){
    if(q===o || q===ignore) continue;
    const qp=q.mesh.position;
    const gap = ((o.kind==='stander'&&q.kind==='stall')||(o.kind==='stall'&&q.kind==='stander')) ? -0.01 : GAP;
    if(Math.abs(qp.z-p.z) < o.hz+q.hz+gap && Math.abs(qp.x-p.x) < o.hx+q.hx+gap) return q;
  }
  // the bike itself: people and traffic don't walk into you (you can still ride into them)
  if(state==='play' && o.kind!=='stall'){
    const bp=player.position;
    const room=0.1+bikeBubble();                    // stopped: people keep a respectful distance and go round
    if(Math.abs(bp.z-p.z) < o.hz+0.85+room && Math.abs(bp.x-p.x) < o.hx+0.25+room) return PLAYER_OBS;
  }
  return null;
}
// the space people leave round you: grows as you slow to a stop, gone once you're riding
const BUBBLE=0.9;
let bubbleK=0;
const bikeBubble=()=>BUBBLE*bubbleK;
const PLAYER_OBS={kind:'player', hx:0.25, hz:0.85, mesh:player};
// widest free gap across the street around o's position (everything within ~1 m along the road counts)
const MIN_PASS = TUNE.minGap;   // bike is 0.5 m wide: always leave this much somewhere to steer through
function freeGap(o, reach=1.0){
  const p=o.mesh.position, iv=[];
  for(const q of obstacles.concat(obstacles.includes(o)?[]:[o])){
    const qp=q.mesh.position;
    if(Math.abs(qp.z-p.z) < o.hz+q.hz+reach) iv.push([qp.x-q.hx, qp.x+q.hx]);
  }
  iv.sort((a,b)=>a[0]-b[0]);
  const R=RH(p.z); let edge=-R, best=0;
  for(const [l,r] of iv){ best=Math.max(best,l-edge); edge=Math.max(edge,r); }
  return Math.max(best, R-edge);
}
// ---------- the director: plans the street as a paced run of designed challenges ----------
// No dice rolls for placement. The level is a fixed sequence (the same street every ride) shaped by a pacing
// curve: an easy start, rising tension with breathers between, a hard finale. It places each challenge just
// ahead of you, times moving traffic to meet you where it planned, always keeps a line you can actually
// steer to, and eases off for a while when you're losing bread.
const LEVEL_SEED=7, DIRECT_AHEAD=TUNE.lookAhead;                   // metres ahead it plans and places
function mulberry(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let dr=null;
function directorReset(){ dr={rng:mulberry(LEVEL_SEED), nextZ:32, lane:-1.0, beat:0, losses:[], log:[]}; }
function directorNoteLoss(n){ if(dr && state==='play') for(let i=0;i<n;i++) dr.losses.push(performance.now()/1000); }
function directorTension(at){
  const k=at/SHOP_Z, wave=Math.sin(k*Math.PI*5)*0.12;   // planned shape of the level, 0..1
  let T=TUNE.tensionStart+TUNE.tensionRise*k+wave;
  if(dr.beat%4===3) T*=0.35;                            // every fourth beat is a breather
  const now=performance.now()/1000; dr.losses=dr.losses.filter(t=>now-t<25);
  return Math.max(0.1,Math.min(1,T*(1.15-Math.min(0.5,dr.losses.length*TUNE.easeOnLoss))));   // losing bread lately → ease off
}
const dpick=arr=>arr[Math.floor(dr.rng()*arr.length)%arr.length];
const vEst=()=>Math.max(Math.abs(speed),CRUISE*0.9);
const dlim=w=>RH(0)-w/2-0.08;
const laneReach=dz=>0.3+1.2*dz/vEst();                  // how far you can shift sideways over dz metres

function placeStatic(kind, side, zAt){
  if(!edgeXNow) return null;
  const t=OBS[kind]; return placeObs(kind,edgeXNow(side,t.w,zAt,t.d),zAt,0);
}
function placeMover(kind, x, zMeet, vz){
  // starts wherever it has to so that it's at (x, zMeet) when you get there
  return placeObs(kind,x,zMeet-vz*Math.max(0,zMeet-z)/vEst(),vz,zMeet);
}
function placeObs(kind, x, z0, vz, plan){
  const t=OBS[kind], o={kind,w:t.w,d:t.d,vx:0,vz,t:0,state:0,phase:dr.rng()*6,directed:true};
  if(vz) o.homeX=x;
  const before=actors.length;
  o.mesh=MODELS[kind](o);
  if(o.cart) o.vz=o.pace;
  o.mesh.position.set(x,0,z0);
  if(vz<0) o.mesh.rotation.y=Math.PI;
  else if(kind==='parkedCar') o.mesh.rotation.y=dr.rng()<.5?0:Math.PI;
  o.hx=t.w/2; o.hz=t.d/2; if(o.fp){ o.hx=o.fp.hx; o.hz=o.fp.hz; }
  const ok=Math.abs(x)+o.hx<=RH(z0)-0.02 && !overlapsAny(o) && freeGap(o,3.0)>=MIN_PASS
    && !customers.some(c=>Math.abs(c.z-(plan??z0))<c.type.l/2+2)
    && !bumps.some(b=>Math.abs(b.z-z0)<b.r+o.hz && Math.abs(b.x-x)<b.r+o.hx);
  if(!ok){ actors.length=before; return null; }         // doesn't fit: that piece is left out
  o.planZ=plan??z0; scene.add(o.mesh); obstacles.push(o); return o;
}

const PATTERNS=[
  // tension range it suits, length in metres, build(z0) → the safe line you'll be on after it
  {name:'breather', t:[0,0.35], len:10, build(){ return dr.lane; }},
  {name:'strollers', t:[0.1,0.6], len:12, build(z0){          // walkers well off your line
    const far=-Math.sign(dr.lane||1);
    placeMover('walkerToward',far*1.6,z0+4,-1.2); if(dr.rng()<0.6) placeMover('walkerAhead',far*0.9,z0+10,1.1);
    return dr.lane; }},
  {name:'gate', t:[0.25,1], len:12, build(z0){                // something parked on your side: move over
    const side=Math.sign(dr.lane)||-1, want=-side*(dlim(0.5)-0.6), dx=Math.min(laneReach(z0-dr.at),Math.abs(want-dr.lane));
    placeStatic(dpick(['parkedCart','crate','parkedCar']),side,z0+6);
    return dr.lane+Math.sign(want-dr.lane)*dx; }},
  {name:'chicane', t:[0.55,1], len:24, build(z0){             // one side, then the other: weave through
    const s=Math.sign(dr.lane)||-1;
    placeStatic(dpick(['crate','parkedCart']),s,z0+5);
    placeStatic(dpick(['crate','parkedCart','parkedCar']),-s,z0+17);
    return s*0.9; }},
  {name:'oncoming', t:[0.3,1], len:14, build(z0){             // coming at you on your line
    placeMover(dpick(['cyclist','motorbike','tuktukToward']),Math.max(-dlim(1),Math.min(dlim(1),dr.lane+0.3)),z0+9,-dpick([4,5,7]));
    return dr.lane; }},
  {name:'overtake', t:[0.45,1], len:20, build(z0){            // slow traffic in your lane, someone coming the other way: time the pass
    placeMover(dpick(['walkerAhead','tuktukAhead']),dr.lane,z0+8,1.2);
    placeMover('walkerToward',-Math.sign(dr.lane||1)*1.4,z0+12,-1.2);
    return dr.lane; }},
  {name:'crowd', t:[0.65,1], len:16, build(z0){               // people across the street, one opening you can reach
    const gap=Math.max(-dlim(0.5)+0.6,Math.min(dlim(0.5)-0.6,dr.lane+dpick([-1,1])*Math.min(1.2,laneReach(10))));
    for(const dx of [-2.2,-1.1,1.1,2.2]){ const xx=gap+dx; if(Math.abs(xx)<dlim(0.5)) placeMover(dx<0?'walkerToward':'walkerAhead',xx,z0+8+dx,dx<0?-1.1:1.1); }
    return gap; }},
];
function directorUpdate(){
  if(!dr || state!=='play') return;
  while(dr.nextZ < Math.min(z+DIRECT_AHEAD, SHOP_Z-20)){
    const T=directorTension(dr.nextZ), z0=dr.nextZ;
    const fits=PATTERNS.filter(p=>T>=p.t[0] && T<=p.t[1]).sort((a,b)=>b.t[0]-a.t[0]);
    const choice=fits.find(p=>p.name!==dr.last && dr.rng()<0.7) || fits[0];   // hardest that suits, not the same twice
    dr.at=dr.lastEnd??z;
    dr.lane=Math.max(-dlim(0.5)+0.5,Math.min(dlim(0.5)-0.5,choice.build(z0)));
    dr.last=choice.name; dr.beat++; dr.lastEnd=z0+choice.len;
    dr.nextZ=z0+choice.len+(TUNE.challengeGap-T*(TUNE.challengeGap-TUNE.challengeGapHard))*vEst();          // same reaction time whatever your speed
    dr.log.push(`${Math.round(z0)}m ${choice.name} (tension ${T.toFixed(2)})`);
  }
}

let stallsNow=[], edgeXNow=null;
function spawnObstacles(){
  actors=[];
  for(const seat of SEATS) seat.used=false;
  obstacles.forEach(o=>scene.remove(o.mesh)); obstacles=[];
  // stalls first, so the street obstacles can avoid blocking the gap beside them
  const stalls=[];
  for(let z=18; z<SHOP_Z-15; z+= 10+Math.random()*14){
    if(nearAlley(z, STALL_D/2+1)) continue;                    // keep alley mouths clear
    const side=Math.random()<.5?-1:1;
    const g=buildStall(side); g.position.set(side*(RH(z)-STALL_W/2), 0, z); scene.add(g);
    obstacles.push({kind:'stall',mesh:g,w:STALL_W,d:STALL_D,hx:STALL_W/2,hz:STALL_D/2,vx:0,vz:0});
    stalls.push({z,side}); if(g.userData.food) steamSources.push({x:side*(RH(z)-STALL_W/2), y:1.5, z});
  }
  const stallAt=(z,d)=>stalls.find(s=>Math.abs(s.z-z)<STALL_D/2+d/2+1.0);
  const edgeX=(side,w,z,d)=>{ // x against the wall, or against the front of a stall if one is there
    const st=stallAt(z,d), R=RH(z); const inner = (st&&st.side===side) ? R-STALL_W : R;
    return side*(inner-w/2-0.05);
  };
  let curR=ROAD_HALF;
  const laneLim=w=>curR-STALL_W-w/2-0.05;   // movers stay out of the stall strip

  // place one street obstacle around z (returns false if it doesn't fit there)
  const spawnOne=(z,forced,school=false)=>{
    curR=RH(z);
    let kind=forced||OBS_BAG[Math.floor(Math.random()*OBS_BAG.length)];
    if(kind==='crosser' || (kind==='cat' && Math.random()<0.85)) kind = Math.random()<.5 ? 'walkerAhead' : 'walkerToward';   // (and only ~1 in 3 cat picks stays a cat)    // crossers come from the alleys (below)
    if(nearAlley(z,1.5) && ['parkedCart','crate','parkedCar','cat'].includes(kind)) kind='walkerToward'; // nothing parked in an alley mouth
    // people only stand still when they're shopping at a stall; anyone else is walking somewhere
    if(kind==='stander' && !stallAt(z,0.5)) kind = Math.random()<.5 ? 'walkerAhead' : 'walkerToward';
    const t=OBS[kind];
    const o={kind,w:t.w,d:t.d,vx:0,vz:0,t:0,state:0,school};
    let x=0, side=Math.random()<.5?-1:1;
    const st=stallAt(z,t.d);
    switch(kind){
      case 'parkedCart':
        if(st&&st.side===side) side=-side;           // a stall already takes that wall here, so park on the other one
        x=edgeX(side,t.w,z,t.d); break;
      case 'crate':

      b.v.y += (2.5-b.v.y)*dt; p.addScaledVector(b.v,dt);
      b.g.rotation.y += (Math.atan2(b.v.x,b.v.z)-b.g.rotation.y)*Math.min(1,dt*6);
      if(p.y>14){ b.state=2; b.g.visible=false; }
    }
  }
}

function animateCat(mesh, speed, dt){
  const q=mesh.userData.quad, t=performance.now()/1000+q.seed, k=Math.min(1,dt*12);
  q.idle = speed>0.2 ? 0 : q.idle+dt;
  const still=q.idle>0.5, sit=still && q.rest==='sit', loaf=still && q.rest==='loaf', arched=still && q.rest==='arch';
  q.ph+=speed*dt*q.stride;
  const amp=Math.min(q.swing,speed*0.3), gallop=Math.min(1,Math.max(0,(speed-2.5)/2)), sw=Math.sin(q.ph);
  // pose: [body height, body pitch, front legs, hind legs, hind hip height]
  const P = sit?[0.11,-0.62,0.62,-1.4,0.08] : loaf?[0.12,0,-1.5,-1.5,0.07] : arched?[0.38,0.22,-0.4,0.25,0.3]
    : [0.31+Math.abs(sw)*0.06*gallop, sw*0.17*gallop, 0,0,0.27];
  q.core.position.y+=(P[0]-q.core.position.y)*k;
  q.core.rotation.x+=(P[1]-q.core.rotation.x)*k;
  q.legs.forEach((L,i)=>{
    const front=i<2, trot=(i===0||i===3?1:-1)*sw, bound=(front?1:-1)*Math.sin(q.ph+(i%2)*0.35);
    const want=still ? P[front?2:3] : (trot+(bound-trot)*gallop)*amp;
    L.rotation.x+=(want-L.rotation.x)*k;
    if(!front) L.position.y+=(P[4]-L.position.y)*k;
  });
  // watches the bike; ears flick; tail wraps round when sitting, up like a flag when walking, out flat when bolting
  let look=0;
  if(still && z!==undefined){
    const d=Math.atan2(x-mesh.position.x,z-mesh.position.z)-mesh.rotation.y;
    look=Math.max(-1.1,Math.min(1.1,Math.atan2(Math.sin(d),Math.cos(d))));
  }
  q.head.rotation.x+=(-P[1]*0.9-q.head.rotation.x)*k;
  q.head.rotation.y+=(look-q.head.rotation.y)*Math.min(1,dt*4);
  q.ears.forEach((e,i)=>{ e.rotation.x=q.chasing?-0.7:0; e.rotation.z=(i?-1:1)*(q.chasing?0.5:Math.max(0,Math.sin(t*1.3+i*2)-0.85)*3); });
  const up=q.chasing||arched ? 1.0 : sit||loaf ? 0 : speed>2 ? 0.2 : 0.9;
  q.tail.position.y+=((sit||loaf?0.06:0.35)-q.tail.position.y)*k;
  q.tail.rotation.x+=(up-q.tail.rotation.x)*k;
  q.tail.rotation.y+=((sit||loaf?-1.5:Math.sin(t*5)*0.25)-q.tail.rotation.y)*k;
  q.tip.rotation.y=(sit||loaf?-0.9:0)+Math.sin(t*3)*0.3;
  q.tip.rotation.x=up*0.4;
}

// ---------- two cats tearing across the street after each other ----------
function spawnCatChases(){
  const n=ti(TUNE.catChases), part_=(SHOP_Z-90)/n;
  for(let i=0;i<n;i++){
    for(let a=0;a<15;a++){
      const cz=45+(i+Math.random())*part_, side=Math.random()<.5?-1:1, R=RH(cz), pair={side,trigger:rnd(12,23),started:false,t:0,legs:0,scatter:false,cats:[]};
      for(let k=0;k<2;k++){
        const mesh=makeCat(), q=mesh.userData.quad;
        mesh.position.set(side*(R-0.5+k*0.8),0,cz+k*0.15);                         // the chaser is further back
        mesh.rotation.y=(k?-side:side)*Math.PI/2;                                 // nose to nose
        q.rest=k?'loaf':'arch';
        pair.cats.push({kind:'cat',mesh,chase:pair,w:0.5,d:0.6,hx:0.28,hz:0.18,vx:0,vz:0,t:0,state:0,dir:-side,speed:0,sv:{x:0,z:0},phase:rnd(0,6)});
      }
      if(pair.cats.some(o=>overlapsAny(o))) continue;
      for(const o of pair.cats){ o.planZ=cz; scene.add(o.mesh); obstacles.push(o); }
      break;
    }
  }
}
// every cat crosses one way, then sits by the wall, jumps on a seat, or slips off down an alley
function chooseCatEnd(o){
  const p=o.mesh.position, side=o.dir, R=RH(p.z), runner=!o.chase || o.chase.cats[0]===o;
  if(!runner){
    const lead=o.chase.cats[0].dest;
    if(lead?.type==='alley') return {...lead, stage:0};                        // follows it down the alley
    if(lead?.type==='seat') return {type:'wait', x:side*(R+0.12), z:lead.z+0.35, stage:0};   // sits below, glaring up
  }
  const nearest=(list,reach)=>list.filter(a=>a.side===side && Math.abs(a.z-p.z)<reach).sort((a,b)=>Math.abs(a.z-p.z)-Math.abs(b.z-p.z))[0];
  const alley=nearest(OPENINGS,11);
  const seat=nearest(SEATS.filter(a=>!a.used && !KERB.some(k=>k.side===a.side && k.z===a.key && !k.m.visible)),8);
  const r=Math.random();
  if(alley && (r<0.4 || (!seat && r<0.7))) return {type:'alley', x:side*(RH(alley.z)-0.2), z:alley.z, al:alley, stage:0};
  if(seat && r<0.85){ seat.used=true; return {type:'seat', x:side*(RH(seat.z)+0.05), z:seat.z, seat, stage:0}; }
  return {type:'wait', x:side*(R+0.15), z:p.z+rnd(-1.5,1.5), stage:0};
}
function updateCat(o, dt){
  if(dt<=0) return;
  const C=o.chase, p=o.mesh.position, q=o.mesh.userData.quad, ahead=p.z-z, runner=!C || C.cats[0]===o;
  if(!o.sv) o.sv={x:0,z:0};
  if(o.phase===undefined) o.phase=rnd(0,6);

  if(C){
    if(runner && !C.started && ((ahead>0 && ahead<C.trigger) || o.heard>0 || o.state===1)){
      C.started=true; bubble(pick(['ناو!','فسسس!','مياااو!']),o.mesh,1.1,0.9);
    }
    if(C.started){
      if(runner) C.t+=dt;
      if(o.state===0 && (runner || C.t>0.18)) o.state=1;
    }
  } else if(o.state===0 && ahead>0 && ahead<o.trigger) o.state=1;

  if(o.state===3){                                                             // up onto the seat
    o.jumpT=Math.min(1,o.jumpT+dt/0.38);
    const k=o.jumpT, to=o.dest.seat;
    p.x=o.from.x+(to.x-o.from.x)*k; p.z=o.from.z+(to.z-o.from.z)*k; p.y=to.y*k+Math.sin(k*Math.PI)*0.35;
    q.chasing=false;
    animateCat(o.mesh,k<1?3:0,dt);
    if(k>=1){ o.state=2; o.vx=o.sv.x=o.sv.z=0; q.rest=Math.random()<.5?'sit':'loaf'; q.idle=9; }
    return;
  }
  if(o.state===2){                                                             // done: stays and watches you
    q.chasing=false;
    const d=-o.dir*Math.PI/2-o.mesh.rotation.y;                                // turns round to face the street
    o.mesh.rotation.y+=Math.atan2(Math.sin(d),Math.cos(d))*Math.min(1,dt*4);
    if(ahead>-15 && ahead<90) animateCat(o.mesh,0,dt);
    return;
  }

  let wx=0, wz=0;
  if(o.state===1){
    if(!o.dest) o.dest=chooseCatEnd(o);
    const D=o.dest, R=RH(p.z), crossing=p.x*o.dir<R-1.4, top=C?(runner?5.4:6.2):Math.min(6.5,o.speed||5);
    let tx=D.x, tz=D.z;
    const lead=C && !runner ? C.cats[0] : null;
    if(lead && crossing && lead.state===1 && (lead.mesh.position.x-p.x)*o.dir>0.3){ tx=lead.mesh.position.x; tz=lead.mesh.position.z; }   // on its tail
    const dx=tx-p.x, dz=tz-p.z, d=Math.hypot(dx,dz)||1;
    wx=dx/d*top; wz=dz/d*top;
    if(lead && d<0.75 && tx!==D.x){ wx*=0.8; wz*=0.8; }
    if(crossing && Math.abs(p.x)<R){
      wz+=Math.sin(o.t*5+o.phase)*(C?1.5:0.6);                                 // jinking
      for(const b of obstacles){                                               // round whatever's in the way
        if(b===o || (C && b.chase===C) || b.dead) continue;
        const bx=b.mesh.position.x-p.x, bz=b.mesh.position.z-p.z;
        if(bx*o.dir>0 && Math.abs(bx)<b.hx+1 && Math.abs(bz)<b.hz+0.35){ wz+=(bz>0?-1:1)*4; wx*=0.75; }
      }
      if(wx*o.dir<1) wx=o.dir;                                                 // one way: never doubles back
    } else if(Math.abs(p.x)>R && p.x*o.dir<0) wz*=0.2;                         // still coming out of its alley
    if(Math.hypot(D.x-p.x,D.z-p.z)<0.3){
      if(D.type==='seat'){ o.state=3; o.jumpT=0; o.from=p.clone(); o.from.y=0; return; }
      if(D.type==='wait'){ o.state=2; o.vx=o.sv.x=o.sv.z=0; p.y=0; q.rest=C && runner?'arch':Math.random()<0.7?'sit':'loaf'; return; }
      if(D.stage){ o.dead=true; scene.remove(o.mesh); return; }                // gone round the back
      D.stage=1; D.x=o.dir*(RH(D.z)+D.al.depth-0.8);                           // through the mouth, down the alley
    }
  }
  const k=Math.min(1,dt*12);
  o.sv.x+=(wx-o.sv.x)*k; o.sv.z+=(wz-o.sv.z)*k;
  p.x+=o.sv.x*dt; p.z+=o.sv.z*dt;
  o.vx=o.sv.x;
  const v=Math.hypot(o.sv.x,o.sv.z);
  if(v>0.4){ const d=Math.atan2(o.sv.x,o.sv.z)-o.mesh.rotation.y; o.mesh.rotation.y+=Math.atan2(Math.sin(d),Math.cos(d))*Math.min(1,dt*16); }
  p.y=Math.abs(Math.sin(o.t*13+o.phase))*Math.min(0.14,v*0.025);               // bounding
  q.chasing=!!C && o.state===1;
  if(ahead>-15 && ahead<90) animateCat(o.mesh,v,dt);
}

  R.j={}; for(const k of ['pitch','roll','torso','load','shins','neck']) R.j[k]={p:0,v:0};
  R.dist=Math.random(); R.wheelA=0; R.amp=0; R.flick=0; R.accel=0;
  o.cart=R; o.pace=rnd(0.65,0.85);                    // slower than anyone walking
  return root;
}

const _reinA=new THREE.Vector3(), _reinB=new THREE.Vector3();
function animateDonkeyCart(o, v, acc, dt){
  const R=o.cart, J=R.j, p=o.mesh.position, t=o.t;
  R.accel+=(acc-R.accel)*Math.min(1,dt*8);
  R.dist+=v*dt/DONKEY_STRIDE; R.wheelA+=v*dt/CART_WHEEL_R;
  R.amp+=(Math.min(1,v/0.2)-R.amp)*Math.min(1,dt*5);

  // four-beat walk: a planted hoof travels back at exactly ground speed, then lifts and swings through
  const A=Math.asin(Math.min(0.9,DONKEY_STRIDE*DONKEY_STANCE/2/0.75));
  R.legs.forEach((L,i)=>{
    const k=((R.dist+L.beat)%1+1)%1, planted=k<DONKEY_STANCE, u=planted?k/DONKEY_STANCE:(k-DONKEY_STANCE)/(1-DONKEY_STANCE);
    const stamp=v<0.05 && i===1 && t%4<0.4 ? Math.sin(t%4/0.4*Math.PI) : 0;   // bored: stamps a hoof while waiting
    L.hip.rotation.x=(planted?-A+2*A*u:A-2*A*u)*R.amp-stamp*0.3;
    L.knee.rotation.x=(planted?0:Math.sin(u*Math.PI)*0.9)*R.amp+stamp*0.9;
  });
  const beat=R.dist*Math.PI*4;
  R.donkey.position.y=0.88-(1-Math.abs(Math.cos(beat)))*0.025*R.amp;
  R.donkey.rotation.z=Math.sin(beat/2)*0.035*R.amp;
  R.donkey.rotation.x=Math.sin(beat)*0.015*R.amp;
  R.neck.rotation.x=spring(J.neck,0.06+Math.sin(beat)*0.1*R.amp-R.accel*0.35,50,8,dt);   // nods in step, pulls on setting off
  R.head.rotation.x=-R.neck.rotation.x*0.5;
  R.tail.rotation.z=Math.sin(t*2.3+o.phase)*0.4; R.tail.rotation.x=0.15;
  R.flick=o.heard>0?1:Math.max(0,Math.sin(t*0.9+o.phase)-0.85)*4;
  R.ears.forEach((e,i)=>{ e.rotation.z=Math.sin(t*15+i*2)*0.3*R.flick; e.rotation.x=o.heard>0?-0.4:0.1; });

  // each wheel finds its own cobbles; the bed rocks on the axle and swings after every start and stop
  const h=R.wheels.map((w,i)=>{
    const y=(Math.sin(p.z*8.3+i*2.1)+0.5*Math.sin(p.z*19+i*4))*0.018*R.amp;
    w.position.y=CART_WHEEL_R+y; w.rotation.x=R.wheelA; return y;
  });
  R.cart.position.y=CART_WHEEL_R+(h[0]+h[1])/2;
  const pitch=R.cart.rotation.x=spring(J.pitch,-R.accel*0.06+Math.sin(beat)*0.012*R.amp,70,6,dt);
  R.cart.rotation.z=spring(J.roll,(h[1]-h[0])/1.16,160,14,dt);
  for(const sh of R.shafts) sh.rotation.x=-pitch*1.4+(0.88-R.donkey.position.y)/1.35;   // hinged: stay on the harness

  // load and driver have their own weight
  R.load.position.y=0.33+Math.max(0,spring(J.load,R.cart.position.y,220,9,dt)-R.cart.position.y);
  const body=R.torso.rotation.x=spring(J.torso,-pitch-R.accel*0.3+Math.sin(beat)*0.03*R.amp,45,6,dt);
  R.torso.rotation.z=-R.cart.rotation.z*0.8;
  const look=Math.hypot(x-p.x,z-p.z)<9 ? Math.atan2(x-p.x,z-p.z) : 0;
  R.driverHead.rotation.y+=(Math.max(-1.2,Math.min(1.2,look))-R.driverHead.rotation.y)*Math.min(1,dt*3);
  R.driverHead.rotation.x=-body*0.6;
  const swing=spring(J.shins,-R.accel*0.5,25,2,dt);
  R.shins.forEach((l,i)=>{ l.rotation.x=0.1+swing+Math.sin(beat/2+i*2)*0.12*R.amp; });
  R.arms.forEach((a,i)=>{ a.rotation.x=-body*0.5-Math.max(0,-R.accel)*0.4+(i&&o.heard>0?Math.sin(t*9)*0.15:0); });   // pulls the reins to stop

  // reins stretch from his hands to the bridle
  R.reins.forEach((r,i)=>{
    R.hands[i].getWorldPosition(_reinA); o.mesh.worldToLocal(_reinA);
    R.mouth.getWorldPosition(_reinB); o.mesh.worldToLocal(_reinB);
    _reinB.x+=i?0.1:-0.1;
    const dx=_reinB.x-_reinA.x, dy=_reinB.y-_reinA.y, dz=_reinB.z-_reinA.z, len=Math.hypot(dx,dy,dz);
    r.position.copy(_reinA); r.scale.z=len;
    r.rotation.y=Math.asin(dx/len); r.rotation.x=Math.atan2(-dy,dz);
  });
}

function updateDonkeyCart(o, dt){
  if(dt<=0) return;
  const p=o.mesh.position, ahead=p.z-z;
  if(!o.awake){ if(ahead>CART_WAKE) return; o.awake=true; }
  // room in front, along its own straight line
  let room=Infinity;
  const look=(qx,qz,hx,hz)=>{
    const d=qz-p.z;
    if(d>0 && Math.abs(qx-p.x)<o.hx+hx+0.08) room=Math.min(room,d-o.hz-hz);
  };
  for(const q of obstacles) if(q!==o && !q.dead) look(q.mesh.position.x,q.mesh.position.z,q.hx,q.hz);
  look(x,z,0.25,0.85);
  const want=Math.min(o.pace,Math.sqrt(2*0.5*Math.max(0,room-0.3))), old=o.sv?o.sv.z:0;
  let v=old+Math.max(-1.2*dt,Math.min(0.4*dt,want-old));   // heavy: slow to get going
  if(room<0.2) v=0;                                        // nose to it: stop, no going round
  p.z+=v*dt;
  o.sv={x:0,z:v};
  if(ahead>-12 && ahead<CART_WAKE) animateDonkeyCart(o,v,(v-old)/dt,dt);
}

// ---------- families: individuals who walk together ----------
// Every member is an obstacle of their own (body, collision, reaction time, gait). The family only
// shares a plan: where the group is heading and which arrangement suits the situation.
//   wide    side by side, kids between the parents        (open street)
//   pairs   parents together, kids just in front          (tighter street)
//   stroll  loose: a kid skips ahead, a parent lags       (nothing going on)
//   file    one behind another, kids between the parents  (squeezing past, or the bell)
//   shield  kids on the far side, parents toward the bike (you passing close by)
//   split   a parent + kid to each side                   (bell, and you're aimed at the middle)
const FAMILY_COLOURS = [0xffc300,0x00a6a6,0xff5d8f,0x2f80ed,0xf77f00];
const FAMILY_WAKE = 75;      // they set off when you're this close (deep in the haze), so they're where planned
const FAMILY_GAP = 0.1;      // how close a member will get to a stranger or a thing

function makeFamily(cx, cz, dir, alley=null, school=false){
  // school=true: a little gang of schoolchildren walking together, no grown-ups
  const friends = school==='friends';                    // two or three young women out together
  const kids = friends ? 2+Math.floor(Math.random()*2) : school ? 2+Math.floor(Math.random()*3) : Math.random()<.5 ? 1 : 2;
  const fam = {x:cx, z:cz, dir, pace:rnd(1.0,1.4), homeX:cx, lane:cx, mode:null, slots:new Map(),
    cross: alley ? {al:alley, way:-alley.side, started:false, blockedT:0} : null,
    thinkT:0, asideT:0, modeT:0, waitT:0, strollT:rnd(2,6), members:[]};
  const colour = pick(FAMILY_COLOURS);                      // dad and kids match, so they read as one family
  for(let i=0;i<(school?kids:2+kids);i++){   // (friends and school gangs have no parents)
    const kid = (school && !friends) || (!school && i>=2), mum = !school && i===1;
    const rig = friends ? personRig(rnd(0.92,1.0), pick([0xe94f7a,0x4caf50,0xf4f1de,0xd98aa0,0x6f93bd,0x161616]), {woman:'hijabi'})
      : personRig(kid ? rnd(0.58,0.7) : mum ? 0.94 : 1.05, mum?0x161616:colour, school?{school:true}:mum?(Math.random()<0.5?{woman:'hijabi'}:{abaya:true}):{});
    const o = {kind:'family', fam, kid, mesh:rig.g, limbs:[rig], hx:kid?0.14:0.2, hz:kid?0.14:0.2,
      vx:0, vz:alley?0:dir*fam.pace, t:0, sv:{x:0,z:0}, wp:rnd(0,6), cadence:kid?1.5:1,
      delay:kid?rnd(0.2,0.55):rnd(0.05,0.35), topSpeed:kid?rnd(2.3,2.9):rnd(1.8,2.2),
      phase:rnd(0,6), slot:null, next:null, stuckT:0, turn:0, turnT:0};
    fam.members.push(o);
  }
  arrangeFamily(fam, alley?'file':'wide');
  for(const o of fam.members){
    o.slot = o.next; o.next = null;
    const g = familyGoal(fam, o.slot);
    o.mesh.position.set(g.x,0,g.z);
    o.mesh.rotation.y = alley ? fam.cross.way*Math.PI/2 : (dir>0?0:Math.PI);
  }
  return fam;
}

// a slot is (a = across the walking direction, b = along it), measured from the family's walking point
function familyGoal(fam, s){
  return fam.cross ? {x:fam.x+fam.cross.way*s.b, z:fam.z+s.a} : {x:fam.x+s.a, z:fam.z+fam.dir*s.b};
}

function arrangeFamily(fam, mode, bikeSide=1){
  const live = fam.members.filter(o=>!o.dead);
  const across = o => fam.cross ? o.mesh.position.z : o.mesh.position.x;
  const along  = o => fam.cross ? o.mesh.position.x*fam.cross.way : o.mesh.position.z*fam.dir;
  // whoever is already nearest takes the place, so people don't walk through each other to swap
  const A = live.filter(o=>!o.kid).sort((p,q)=>across(p)-across(q));
  const K = live.filter(o=>o.kid).sort((p,q)=>across(p)-across(q));
  const set = (o,a,b) => fam.slots.set(o,{a,b});
  fam.slots.clear();
  if(mode==='wide'){
    const row = A.length ? [A[0],...K,...A.slice(1)] : K;
    row.forEach((o,i)=>set(o,(i-(row.length-1)/2)*(fam.arm?0.46:0.58), o.kid?0.12:0));
  } else if(mode==='pairs'){
    A.forEach((o,i)=>set(o,(i-(A.length-1)/2)*0.62,-0.35));
    K.forEach((o,i)=>set(o,(i-(K.length-1)/2)*0.5,0.4));
  } else if(mode==='stroll'){
    A.forEach((o,i)=>set(o,(i-(A.length-1)/2)*0.7+rnd(-.08,.08), i?rnd(-.9,-.3):rnd(-.2,.2)));
    K.forEach((o,i)=>set(o,(i-(K.length-1)/2)*0.6+rnd(-.15,.15), rnd(0.6,1.4)));
  } else if(mode==='file'){
    const front = A.slice().sort((p,q)=>along(q)-along(p)), kids = K.slice().sort((p,q)=>along(q)-along(p));
    const line = front.length ? [front[0],...kids,...front.slice(1)] : kids;
    line.forEach((o,i)=>set(o,0,((line.length-1)/2-i)*0.62));
  } else if(mode==='shield'){
    A.forEach((o,i)=>set(o, bikeSide*0.3,((A.length-1)/2-i)*0.7));
    K.forEach((o,i)=>set(o,-bikeSide*0.27,((K.length-1)/2-i)*0.6));
  } else if(mode==='split'){
    // a = distance either side of the bike's line when the bell rang
    const off = 1.15*BELL_STEP, mid = fam.splitX-fam.x;
    A.forEach((o,i)=>set(o,mid+(i?off:-off),0.3));
    // with one kid, the kid goes with the nearer parent
    K.forEach((o,i)=>{ const right = K.length>1 ? i===1 : across(o)>fam.x; set(o,mid+(right?off:-off),-0.35); });
  }
  fam.mode = mode;
  // nobody reacts at the same instant
  for(const o of live){ o.next = fam.slots.get(o); o.nextT = o.delay+(o.deaf?0.8:0); }
}

// is a lane `half` metres either side of cx clear for the next few metres?
function laneClear(fam, cx, half){
  const R = RH(fam.z);
  if(Math.abs(cx)+half > R-0.05) return false;
  for(const q of obstacles){
    if(q.fam===fam || q.dead) continue;
    const d = (q.mesh.position.z-fam.z)*fam.dir;
    if(d < -q.hz-0.8 || d > q.hz+4.5) continue;
    if(q.vz && (q.vz-fam.dir*fam.pace)*fam.dir > 0.1) continue;   // pulling away from us
    if(Math.abs(q.mesh.position.x-cx) < q.hx+half+FAMILY_GAP) return false;
  }
  return true;
}

function planFamily(fam, live){
  if(fam.cross) return {mode: Math.abs(fam.x) < RH(fam.z)-0.5 ? 'pairs' : 'file'};
  const R = RH(fam.z), right = -fam.dir, ahead = fam.z-z;
  const off = fam.x-x, bikeNear = ahead>-2 && ahead<Math.max(9,speed*1.3);
  const heard = live.some(o=>o.heard>0) && ahead>-2;

  if(heard) fam.asideT = 6;
  // once aside they stay there until you've gone by (or 6 s, if you stopped)
  if(heard || (fam.aside && ahead>-2 && fam.asideT>0)){
    // already stepping aside: stick with that choice instead of dithering
    if(fam.aside) return fam.aside;
    if(Math.abs(off)<1.9){
      const lo = x-1.15*BELL_STEP, hi = x+1.15*BELL_STEP, loOK = laneClear(fam,lo,0.25), hiOK = laneClear(fam,hi,0.25);
      if(loOK && hiOK && Math.abs(off)<0.4 && live.length>2){ fam.splitX = x; return fam.aside = {mode:'split'}; }
      const src=live.find(o=>o.bellFrom)?.bellFrom, first = src && Math.abs(fam.x-src.x)>0.15 ? Math.sign(fam.x-src.x) : Math.abs(off)<0.15 ? right : Math.sign(off);
      for(const side of [first,-first]) for(const d of [1.2,1.6,2.1].map(v=>v*BELL_STEP)){
        if(laneClear(fam,x+side*d,0.25)) return fam.aside = {mode:'file', lane:x+side*d};
      }
      return fam.aside = {mode:'file', lane:Math.max(-R+0.35,Math.min(R-0.35,x+first*1.2*BELL_STEP))};
    }
  } else fam.aside = null;

  // how wide can they be here and still leave the bike a way through?
  const fits = (cx,half) => laneClear(fam,cx,half) && Math.max(R-(cx+half),cx-half+R) >= MIN_PASS+0.2;
  const wide = (live.length-1)*0.29+0.2;
  if(bikeNear){
    if(Math.abs(off)<0.8) return {mode:'file'};                    // you're coming at them: they close up, kids between
    if(Math.abs(off)<2.6 && fits(fam.x,0.5)) return {mode:'shield', side:-Math.sign(off)};
  }
  const room = Math.max(0,R-wide-0.15), lane = Math.max(-room,Math.min(room,fam.homeX));
  if(fits(lane,wide)) return {mode:fam.strolling?'stroll':'wide', lane};
  if(fits(fam.x,0.5)) return {mode:'pairs'};
  // blocked: single file through the nearest opening, their own right wins ties
  let best = null, bestCost = 1e9;
  for(let c=-R+0.3; c<=R-0.3; c+=0.2){
    if(!laneClear(fam,c,0.22)) continue;
    const cost = Math.abs(c-fam.x)+Math.abs(c-fam.homeX)*0.2+(Math.sign(c-fam.x)===right?0:0.15);
    if(cost<bestCost){ bestCost = cost; best = c; }
  }
  return {mode:'file', lane:best??fam.x};
}

function familyTurnsAlong(fam, live){
  const c = fam.cross, R = RH(fam.z);
  fam.mouth = c.al; fam.cross = null;
  fam.dir = Math.random()<.5 ? 1 : -1;
  fam.x = fam.homeX = fam.lane = Math.max(-R+0.6,Math.min(R-0.6,fam.x));
  fam.z = live.reduce((n,o)=>n+o.mesh.position.z,0)/live.length;
  arrangeFamily(fam,'file');
}

function updateFamily(fam, dt, danger){
  const live = fam.members.filter(o=>!o.dead);
  if(!live.length) return;
  if(!fam.cross && !fam.awake){
    if(fam.z-z>FAMILY_WAKE) return;
    fam.awake = true;
  }
  fam.asideT -= dt; fam.thinkT -= dt; fam.modeT += dt; fam.strollT -= dt;
  if(fam.strollT<=0){ fam.strolling = !fam.strolling; fam.strollT = rnd(3,7); }

  if(fam.thinkT<=0){
    fam.thinkT = 0.15;
    const plan = planFamily(fam, live), urgent = plan.mode==='file' || plan.mode==='split';
    if(plan.lane!==undefined) fam.lane = plan.lane;
    // squeeze up at once; only spread out again after a moment, so they don't flicker
    if(plan.mode!==fam.mode && (urgent || fam.modeT>1.2)){ arrangeFamily(fam,plan.mode,plan.side); fam.modeT = 0; }
  }

  // you've stopped: the family files past in a lane clear of the ring around the bike, instead of pressing into it
  if(!fam.cross && bubbleK>0.3 && Math.abs(fam.z-z)<7){
    const R=RH(fam.z)-0.6, side=fam.x>=x?1:-1, need=bikeBubble()+1.4;
    let lane=x+side*need; if(Math.abs(lane)>R) lane=x-side*need;
    fam.lane=Math.max(-R,Math.min(R,lane));
    if(fam.mode!=='file'){ arrangeFamily(fam,'file',Math.sign(fam.lane-x)||side); fam.modeT=0; }
  }
  // the family waits for whoever falls behind (but not forever)
  let behind = 0;
  for(const o of live){
    if(o.stuckT>2.5 || !o.slot) continue;
    const g = familyGoal(fam,o.slot), p = o.mesh.position;
    behind = Math.max(behind, fam.cross ? (g.x-p.x)*fam.cross.way : (g.z-p.z)*fam.dir);
  }
  const follow = behind>2.2 ? 0 : behind>1.1 ? 0.45 : 1;
  fam.waitT = follow===0 ? fam.waitT+dt : 0;

  const c = fam.cross;
  if(c){
    const heard = live.some(o=>o.heard>0);
    if(!c.started && !heard && fam.z-z>-1 && fam.z-z<fam.trigger) c.started = true;
    // bell: stop short of your line if they haven't reached it
    let go = c.started ? follow : 0;
    const front = fam.x+c.way*0.9;
    if(heard && (x-front)*c.way>0){ const d = Math.hypot(x-front,fam.z-z); go *= d<5 ? 0 : Math.min(1,(d-5)/9); }
    const opp = oppositeOf(c.al), R = RH(fam.z);
    fam.x += c.way*fam.pace*(1+danger*0.5)*go*dt;
    if(opp){
      const k = Math.max(0,Math.min(1,(fam.x*c.way+R)/(2*R)));
      fam.z = c.al.z+(opp.z-c.al.z)*k;
      if(fam.x*c.way > R+opp.depth) fam.x = c.way*(R+opp.depth);
    }
    c.blockedT = fam.waitT>0 && Math.abs(fam.x)<R ? c.blockedT+dt : 0;
    if((!opp && fam.x*c.way>=R-1.1) || c.blockedT>1.5) familyTurnsAlong(fam,live);
  } else {
    const heard = live.some(o=>o.heard>0), lateral = heard?3.2:1.2;
    fam.x += Math.max(-lateral*dt,Math.min(lateral*dt,fam.lane-fam.x));
    fam.z += fam.dir*fam.pace*follow*dt;
    if(fam.waitT>3){                                      // give up waiting: regroup where they actually are
      fam.z = live.reduce((n,o)=>n+o.mesh.position.z,0)/live.length; fam.waitT = 0;
    }
  }
  for(const o of live) moveFamilyMember(fam,o,dt);
  if(fam.arm){                                            // arm in arm while walking abreast
    const linked=fam.mode==='wide'||fam.mode==='stroll';
    live.forEach((o,i)=>{ const r=o.limbs[0];
      if(linked && i<live.length-1){ r.arms[1].rotation.set(-0.25,0,0.75); r.elbows[1].rotation.x=-1.3; }
      if(linked && i>0){ r.arms[0].rotation.set(-0.25,0,-0.75); r.elbows[0].rotation.x=-1.3; }
    });
  }
}

function memberCanStand(fam, o, tx, tz){
  const p = o.mesh.position, R = RH(tz);
  if(Math.abs(tx)+o.hx > R){
    const worse = Math.abs(tx) > Math.abs(p.x);
    if(worse && !alleyAt(tz,Math.sign(tx),-o.hz)) return false;
  }
  // can't step into anyone; if already touching, may only step apart
  const clear = (q,qx,qz,hx,hz,gap) => {
    const rx = o.hx+hx+gap, rz = o.hz+hz+gap;
    if(Math.abs(qx-tx)>=rx || Math.abs(qz-tz)>=rz) return true;
    const touching = Math.abs(qx-p.x)<rx && Math.abs(qz-p.z)<rz;
    return touching && Math.hypot(qx-tx,qz-tz) > Math.hypot(qx-p.x,qz-p.z);
  };
  for(const q of obstacles){
    if(q===o || q.dead) continue;
    if(!clear(q,q.mesh.position.x,q.mesh.position.z,q.hx,q.hz,q.fam===fam?0:FAMILY_GAP)) return false;
  }
  return state!=='play' || clear(null,x,z,0.25,0.85,0.1+bikeBubble());
}

function memberKeepsGap(o, tx, tz){
  if(Math.abs(tz-z)<3) return true;
  const p = o.mesh.position, px = p.x, pz = p.z;
  p.x = tx; p.z = tz; const after = freeGap(o,1.5);
  p.x = px; p.z = pz;
  return after>=MIN_PASS || after>=freeGap(o,1.5)-1e-3;
}

const FAMILY_STEER = [0,0.5,1,1.5,2.1];
function moveFamilyMember(fam, o, dt){
  const p = o.mesh.position, px = p.x, pz = p.z;
  o.t += dt; o.turnT -= dt;
  if(o.next){ o.nextT -= dt; if(o.nextT<=0 || !o.slot){ o.slot = o.next; o.next = null; } }

  const g = familyGoal(fam,o.slot), R = RH(pz);
  if(!fam.cross){
    g.x += Math.sin(o.t*1.7+o.phase)*(o.kid?0.07:0.03);   // nobody walks a perfectly straight line
    const lim = R-o.hx-0.05;
    g.x = Math.max(-lim,Math.min(lim,g.x));
    if(Math.abs(px)>lim && fam.mouth) g.z = pz;           // still in an alley: come out through the mouth first
  }

  // keep up with the moving place, plus a correction toward it
  const walking = fam.cross ? (fam.cross.started?fam.pace:0) : fam.pace;
  let dx = (g.x-px)*2.2, dz = (g.z-pz)*2.2;
  if(fam.waitT===0){
    if(fam.cross){ if((g.x-px)*fam.cross.way>-0.3) dx += fam.cross.way*walking; }
    else if((g.z-pz)*fam.dir>-0.5) dz += fam.dir*walking;
  }
  // a little personal space from the rest of the family
  for(const q of fam.members){
    if(q===o || q.dead) continue;
    const sx = px-q.mesh.position.x, sz = pz-q.mesh.position.z, d = Math.hypot(sx,sz), room = o.hx+q.hx+0.14;
    if(d>1e-3 && d<room){ dx += sx/d*(room-d)*4; dz += sz/d*(room-d)*4; }

  const top = o.topSpeed*(o.heard>0?1.6:1), want = Math.hypot(dx,dz);
  if(want>top){ dx *= top/want; dz *= top/want; }

  // pick the closest open direction to where they want to go (own right first), and stick to it briefly
  let tx = 0, tz = 0;
  if(want>0.05){
    const first = o.turnT>0 ? o.turn : -1;
    search: for(const a of FAMILY_STEER) for(const s of (a?[first,-first]:[1])){
      const co = Math.cos(a*s), si = Math.sin(a*s), vx = dx*co+dz*si, vz = dz*co-dx*si;

      tx = vx; tz = vz;
      if(a){ o.turn = s; o.turnT = 0.5; }
      break search;
    }
  }
  const acc = (o.heard>0 ? 8 : o.kid ? 5 : 3.5)*dt, ex = tx-o.sv.x, ez = tz-o.sv.z, e = Math.hypot(ex,ez);
  const k = e>acc ? acc/e : 1;
  o.sv.x += ex*k; o.sv.z += ez*k;

  // full step, else slide along whichever axis is open
  for(const [mx,mz] of [[o.sv.x,o.sv.z],[tx,tz],[0,o.sv.z],[o.sv.x,0]]){
    if(!mx && !mz) continue;
    const nx = px+mx*dt, nz = pz+mz*dt;
    if(memberCanStand(fam,o,nx,nz) && memberKeepsGap(o,nx,nz)){ p.x = nx; p.z = nz; break; }
  }
  o.sv.x = (p.x-px)/dt; o.sv.z = (p.z-pz)/dt;
  o.vx = o.sv.x; o.vz = fam.cross ? 0 : fam.dir*fam.pace;

  const moved = Math.hypot(o.sv.x,o.sv.z);
  o.stuckT = want>0.4 && moved<0.08 ? o.stuckT+dt : 0;
  let face = null;
  if(moved>0.25) face = Math.atan2(o.sv.x,o.sv.z);
  else if(Math.hypot(x-px,z-pz)<7) face = Math.atan2(x-px,z-pz);   // standing: watch the bike go by
  if(face!==null){ const d = face-o.mesh.rotation.y; o.mesh.rotation.y += Math.atan2(Math.sin(d),Math.cos(d))*Math.min(1,dt*6); }
  animateWalk(o,moved,dt);

  const c = fam.cross, opp = c && oppositeOf(c.al);
  const indoors = opp && p.x*c.way > R+opp.depth-2.2;
  if(indoors || (o.stuckT>4 && pz-z<-6)){ o.dead = true; scene.remove(o.mesh); }
}

  // target in the chest's space; shoulder and elbow bend to put the wrist on it
  if(offset) anchor.localToWorld(ikT.copy(offset)); else anchor.getWorldPosition(ikT);
  bikeRig.chest.updateWorldMatrix(true,false);
  bikeRig.chest.worldToLocal(ikT);

  const a=A.upper, b=A.fore, d=Math.max(Math.abs(a-b)+0.01,Math.min(a+b-0.002,ikD.length()));
  ikD.normalize();
  const along=(a*a-b*b+d*d)/(2*d), out=Math.sqrt(Math.max(0,a*a-along*along));
  ikP.copy(A.pole).addScaledVector(ikD,-A.pole.dot(ikD)).normalize();
  ikE.copy(ikD).multiplyScalar(along).addScaledVector(ikP,out);      // elbow, from the shoulder
  ikT.copy(ikD).multiplyScalar(d).sub(ikE).normalize();              // forearm direction
  A.shoulder.quaternion.setFromUnitVectors(DOWN,ikE.normalize());
  ikQ.copy(A.shoulder.quaternion).invert();
  A.elbow.quaternion.setFromUnitVectors(DOWN,ikT.applyQuaternion(ikQ));

}

// ---------- stray dogs: sleep in the shade, look up, sometimes chase you barking ----------
let dogs=[];
function makeDog(){
  const col=pick([0xc8a27a,0x8b6b4a,0xe0c9a6,0x5c4a3a,0xa58b6f]), g=new THREE.Group();
  const body=mergeParts([B(0.32,0.3,0.75,0,0,0,col)]); body.position.y=0.42; g.add(body);
  const head=new THREE.Group(); head.position.set(0,0.55,0.38); head.add(mergeParts([B(0.24,0.24,0.26,0,0.05,0.08,col), B(0.14,0.12,0.18,0,0,0.26,col), B(0.06,0.05,0.04,0,0.03,0.36,0x111111),
    B(0.06,0.12,0.04,-0.08,0.2,0.02,col,0,0,-0.3), B(0.06,0.12,0.04,0.08,0.2,0.02,col,0,0,0.3)])); g.add(head);
  const legs=[]; for(const [lx,lz] of [[-0.11,0.28],[0.11,0.28],[-0.11,-0.28],[0.11,-0.28]]){ const L=new THREE.Group(); L.position.set(lx,0.32,lz); L.add(mergeParts([B(0.08,0.32,0.08,0,-0.16,0,col)])); g.add(L); legs.push(L); }
  const tail=new THREE.Group(); tail.position.set(0,0.5,-0.37); tail.add(mergeParts([B(0.05,0.05,0.3,0,0.05,-0.13,col,-0.6)])); g.add(tail);
  return {g,body,head,legs,tail};

// sleeping packs: ride past gently and they sleep on; go past fast, ring the bell or crash near them and they all come
const PACK_CALM=CRUISE+0.6;     // m/s: at normal speed or slower you can slip past
const PACK_HEAR=9, PACK_BELL=18, PACK_CRASH=25;
let packs=[];
function spawnDogs(){
  for(const d of dogs) scene.remove(d.g); dogs=[]; packs=[];
  if(!LV().dogs) return;
  const PACKS=ti(TUNE.dogPacks), stretch=(SHOP_Z-100)/PACKS;    // 2 or 3 packs a ride, spread out
  for(let i=0;i<PACKS;i++){
    let dz=60+(i+0.5)*stretch+rnd(-0.25,0.25)*stretch;
    for(let a=0;a<12 && nearAlley(dz,3);a++) dz+=4;
    const side=Math.random()<.5?-1:1, pack={z:dz,side,awake:false,dogs:[]};
    for(let i=0,n=ti(TUNE.dogsPerPack);i<n;i++){
      const d=makeDog(), hz=dz+(i-(n-1)/2)*0.95+rnd(-0.2,0.2);
      d.home=new THREE.Vector3(side*(RH(hz)-0.35-(i%2)*0.55),0,hz); d.g.position.copy(d.home);
      d.g.rotation.y=rnd(0,Math.PI*2); scene.add(d.g);
      Object.assign(d,{side,pack,slot:i,state:'sleep',t:rnd(0,6),v:new THREE.Vector3(),barkT:0,chaseT:0,nipT:0,nipCool:0});
      dogs.push(d); pack.dogs.push(d);
    }
    packs.push(pack);
  }
}
function wakePacks(){
  if(state!=='play' && !crashed) return;
  const rang=nowS()-bellAt<0.3;
  for(const pk of packs){
    if(pk.awake) continue;
    const d=Math.hypot(pk.side*RH(pk.z)-x,pk.z-z);
    const why = crashed&&d<PACK_CRASH ? 'crash' : rang&&d<PACK_BELL ? 'bell' : Math.abs(speed)>PACK_CALM&&d<PACK_HEAR ? 'fast' : null;
    if(!why) continue;
    pk.awake=true;
    pk.dogs.forEach((dg,i)=>setTimeout(()=>{ if(dg.state!=='sleep') return;
      dg.state='chase'; dg.chaseT=rnd(5,8); bubble(pick(['هو هو!','هو هو هو!','غرررر!']),dg.g,1.1,1); }, i*rnd(120,380)));
    toast(why==='bell'?'🐕 الجرس صحّى الكلاب!':why==='crash'?'🐕 الخبطة صحّت الكلاب!':'🐕 كنت بتجري أوي وصحّيت الكلاب!');
  }
}
function poseDog(d,lying,run,dt){
  const k=Math.min(1,dt*6);
  d.body.position.y += ((lying?0.2:0.42)-d.body.position.y)*k;
  d.legs.forEach((L,i)=>{ const want = lying ? -1.45 : run>0 ? Math.sin(d.t*16+(i<2?0:Math.PI)+(i%2)*0.6)*0.8*Math.min(1,run/4) : 0; L.rotation.x+=(want-L.rotation.x)*Math.min(1,dt*(run?20:6)); L.position.y+=((lying?0.12:0.32)-L.position.y)*k; });
  d.head.position.y += ((lying?0.3:0.55)-d.head.position.y)*k;
  d.tail.rotation.y = Math.sin(d.t*(run?14:3))*(run?0.6:0.3);
}
function updateDogs(dt){
  wakePacks();
  for(const d of dogs){
    d.t+=dt; const p=d.g.position, dB=Math.hypot(p.x-x,p.z-z);
    // running into a dog works like a cat: a bump, and the harder you hit it the more bread jumps off
    if(d.bumpT>0) d.bumpT-=dt;
    if(state==='play' && !crashed && !(d.bumpT>0) && Math.abs(p.x-x)<0.5 && Math.abs(p.z-z)<0.65){
      d.bumpT=1.5;
      const rel=Math.hypot(speed-d.v.z, vx-d.v.x), lost=Math.min(loaves.length, catLoss(rel));
      lossTag='dog'; for(let i=0;i<lost;i++) dropLoaf(Math.random()<.5?-1:1, vx, speed*0.8);
      speed*=Math.max(0.4, 1-rel*0.04);
      vx += (x>p.x?1:-1)*Math.min(2.5, rel*0.25);
      lean.rotation.z += (Math.random()-0.5)*0.4;
      d.v.set((p.x>x?1:-1)*3,0,1); p.x+=(p.x>x?1:-1)*0.3;                  // knocked aside
      bubble(pick(['عيييي!','عووووو!']),d.g,1.1,0.9);
      if(d.state==='sleep'){ d.state='chase'; d.chaseT=rnd(4,7); d.pack.awake=true; }   // and now it's after you
    }
    if(d.state==='sleep'){
      poseDog(d,true,0,dt);
      const awake = state==='play' && dB<7;
      d.head.rotation.x += ((awake?-0.25:0.45)-d.head.rotation.x)*Math.min(1,dt*4);   // lifts its head as you come by
      if(awake){ const yaw=Math.atan2(x-p.x,z-p.z)-d.g.rotation.y; d.head.rotation.y += (Math.atan2(Math.sin(yaw),Math.cos(yaw))*0.8-d.head.rotation.y)*Math.min(1,dt*4); }
      if(awake && Math.random()<dt*0.3) bubble('z z',d.g,0.9,0.9);          // still asleep: you're getting away with it
    } else if(d.state==='chase'){
      // gallops along beside you, barking, until it gets bored (or you're too fast)
      d.chaseT-=dt; const tx=x+d.side*(1.0+(d.slot%2)*0.55), tz=z-0.7-d.slot*0.6;   // the pack fans out beside and behind you
      // a dog that keeps up right beside you for a moment jumps for the rack and snatches a loaf
      d.nipCool-=dt;
      const close=Math.hypot(x-p.x,z-p.z)<1.6 && state==='play';
      d.nipT = close ? d.nipT+dt : 0;
      if(d.nipT>TUNE.dogBiteTime && d.nipCool<=0 && loaves.length){
        d.nipT=0; d.nipCool=3; lossTag='dog'; dropLoaf(-d.side,vx,speed*0.5); bubble('غرررر!',d.g,1.1,0.8); toast('🐕 كلب خطف رغيف! اهرب منهم');
      }
      const ddx=tx-p.x, ddz=tz-p.z, n=Math.hypot(ddx,ddz)||1, vmax=TUNE.dogSpeed;
      const want=new THREE.Vector3(ddx/n,0,ddz/n).multiplyScalar(Math.min(vmax, n*3));
      d.v.lerp(want, Math.min(1,dt*3)); p.addScaledVector(d.v,dt);
      const R=RH(p.z)-0.3; p.x=Math.max(-R,Math.min(R,p.x));
      const sp=d.v.length(); if(sp>0.3) d.g.rotation.y += (Math.atan2(Math.sin(Math.atan2(d.v.x,d.v.z)-d.g.rotation.y),Math.cos(Math.atan2(d.v.x,d.v.z)-d.g.rotation.y)))*Math.min(1,dt*8);
      poseDog(d,false,sp,dt); d.head.rotation.x=-0.3+Math.sin(d.t*9)*0.15;
      d.barkT-=dt; if(d.barkT<=0){ d.barkT=rnd(0.8,1.6); bubble(pick(['هو هو!','هو هو هو!','غرررر!']),d.g,1.1,0.8); }
      if(d.chaseT<=0 || n>14 || state!=='play') d.state='return';
    } else if(d.state==='return'){
      const ddx=d.home.x-p.x, ddz=d.home.z-p.z, n=Math.hypot(ddx,ddz);
      if(n<0.2){ d.state='sleep'; poseDog(d,true,0,dt); continue; }
      d.v.set(ddx/n*1.4,0,ddz/n*1.4); p.addScaledVector(d.v,dt);
      d.g.rotation.y += Math.atan2(Math.sin(Math.atan2(d.v.x,d.v.z)-d.g.rotation.y),Math.cos(Math.atan2(d.v.x,d.v.z)-d.g.rotation.y))*Math.min(1,dt*5);
      poseDog(d,false,1.4,dt);
    }
  }
}

function addWet(wx,wz,rx,rz){ const m=new THREE.Mesh(new THREE.CircleGeometry(1,20),wetMat); m.rotation.x=-Math.PI/2; m.scale.set(rx,rz,1); m.position.set(wx,0.012,wz); scene.add(m); wets.push({m,x:wx,z:wz,rx,rz}); }
function onWet(px,pz){ for(const w of wets){ const a=(px-w.x)/w.rx, b=(pz-w.z)/w.rz; if(a*a+b*b<1) return true; } return false; }
let nextSplash=3;
const dropGeo=new THREE.SphereGeometry(0.05,6,4), dropMat=new THREE.MeshLambertMaterial({color:0x9ad1f5, transparent:true, opacity:0.8});
function spawnWets(){ for(const w of wets) scene.remove(w.m); for(const s of splashes) scene.remove(s.m); wets=[]; splashes=[]; nextSplash=3;
  for(let wz=60+Math.random()*40; wz<SHOP_Z-20; wz+=rnd(80,140)){ const side=Math.random()<.5?-1:1; addWet(side*(RH(wz)-rnd(0.8,1.6)), wz, rnd(0.8,1.4), rnd(1.2,2.2)); } }
function updateWets(dt){
  if(state==='play'){ nextSplash-=dt; if(nextSplash<=0){ nextSplash=rnd(5,10);
    // someone throws a bucket of water out of a shop ahead of you
    const wz=z+rnd(18,32), side=Math.random()<.5?-1:1, R=RH(wz), fx=side*(R+FRONT), tx=side*(R-rnd(0.9,1.8));
    for(let i=0;i<26;i++){ const m=new THREE.Mesh(dropGeo,dropMat); m.position.set(fx,1.0,wz+rnd(-0.3,0.3)); scene.add(m);
      splashes.push({m,v:new THREE.Vector3((tx-fx)*rnd(0.6,1.2),rnd(1.5,3),rnd(-1.2,1.2)),t:0}); }
    setTimeout(()=>addWet(tx,wz,rnd(0.8,1.3),rnd(1.1,2.0)),450);
  } }
  for(const s of splashes){ s.t+=dt; s.v.y-=G*dt; s.m.position.addScaledVector(s.v,dt); if(s.m.position.y<0.03){ s.m.position.y=0.03; s.v.set(0,0,0); s.m.scale.setScalar(Math.max(0.01,1-(s.t-0.5)*2)); } }
  splashes=splashes.filter(s=>{ if(s.t>1.2){ scene.remove(s.m); return false; } return true; });
}

const smokeTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,2,32,32,30); gr.addColorStop(0,'rgba(255,255,255,0.9)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
let puffs=[];
function updateSmoke(dt){
  const srcs=steamSources.concat(SMOKE_STATIC);
  for(const s of srcs){ const a=s.z-z; if(a<-5||a>45) continue;
    s.acc=(s.acc||0)+dt*(s.shisha?1.2:3); while(s.acc>1){ s.acc-=1;
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:0,color:s.shisha?0xdedede:0xffffff}));
      sp.position.set(s.x+rnd(-0.15,0.15),s.y,s.z+rnd(-0.2,0.2)); scene.add(sp); puffs.push({sp,t:0,life:rnd(2,3.2),dx:rnd(-0.2,0.2)}); } }
  for(const p of puffs){ p.t+=dt; const k=p.t/p.life;
    const gust = state==='play' ? Math.max(0,1-Math.abs(p.sp.position.z-z)/3)*speed*0.25 : 0;
    p.sp.position.y+=0.55*dt; p.sp.position.x+=p.dx*dt; p.sp.position.z+=gust*dt; const sc=0.3+k*1.4; p.sp.scale.set(sc,sc,1);
    p.sp.material.opacity=Math.sin(Math.min(1,k)*Math.PI)*0.35; }
  puffs=puffs.filter(p=>{ if(p.t>=p.life){ scene.remove(p.sp); p.sp.material.dispose(); return false; } return true; });
}

const moneyEl=document.getElementById('money');
// chunky cartoon cash: a thick green slab, lime note printed on top, dark outline round it
const cashTop=(()=>{
  const c=document.createElement('canvas'); c.width=256; c.height=160; const g=c.getContext('2d');
  g.fillStyle='#3cb54a'; g.fillRect(0,0,256,160);
  g.fillStyle='#8ef50f'; g.fillRect(34,28,188,104);

  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
})();
const cashSide=new THREE.MeshBasicMaterial({color:0x07913f}), cashFace=new THREE.MeshBasicMaterial({map:cashTop});
const cashMats=[cashSide,cashSide,cashFace,cashSide,cashSide,cashSide];          // the top (+y) face carries the print
const cashGeo=new THREE.BoxGeometry(0.3,0.06,0.19);

function makeCash(){ const g=new THREE.Group(); g.add(new THREE.Mesh(cashGeo,cashMats), new THREE.Mesh(outlineGeo,outlineMat)); return g; }
// banknotes and coins fly from the customer to your hand; each one adds to the purse as it lands
function payRider(c){
  cashSound();
  const got=c.got??c.type.order, pay=Math.max(1,Math.round(got*LOAF_PRICE*(c.short?0.5:1))), tip=0, total=pay+tip;
  const from=(c.home?c.basket:c.rg.g).getWorldPosition(new THREE.Vector3()); from.y+=c.home?0.4:1.3;
  const notes=Math.max(1,Math.floor(pay/5)), coins=0;
  const share=[...Array(notes).fill(5), ...Array(coins).fill(tip/coins)];
  share[0]+=pay-notes*5;
  share.forEach((v,i)=>{
    const coin=i>=notes, m=makeCash();
    m.position.copy(from); m.scale.setScalar(coin?0.7:1); m.rotation.set(rnd(-0.4,0.4),rnd(0,6),rnd(-0.4,0.4)); scene.add(m);
    cash.push({m,from:from.clone(),t:-0.5-i*0.13,v,coin,spin:rnd(-9,9)});
  });
  bubble(`+${total} ج 💰`,...(c.home?(([o,d])=>[o,d+0.7])(sayAt(c)):[c.rg.g,2.6]),2);
  return total;
}
function updateCash(dt){
  if(!cash.length) return;
  const hand=new THREE.Vector3();
  for(const k of cash){
    k.t+=dt/0.7; if(k.t<0) continue;
    const u=Math.min(1,k.t); hand.set(x+0.2,1.45,z+0.1);
    k.m.position.lerpVectors(k.from,hand,u); k.m.position.y+=Math.sin(u*Math.PI)*(k.coin?0.9:0.6);
    k.m.rotation.y+=k.spin*dt; k.m.rotation.x=Math.sin(k.t*6)*0.35;               // tumbling, but the print keeps showing
    const pop=1+Math.sin(Math.min(1,u)*Math.PI)*0.35; k.m.scale.setScalar((k.coin?0.7:1)*pop);
    if(u>=1 && !k.done){ k.done=true; earned+=k.v; moneyEl.textContent=`💵 ${Math.round(earned)}`;
      moneyEl.classList.add('pop'); setTimeout(()=>moneyEl.classList.remove('pop'),150); }
  }
  cash=cash.filter(k=>{ if(k.done){ scene.remove(k.m); return false; } return true; });
}

function updateRequestMarkers(dt){

    if(c.home){
      let to=BASKET_UP-0.4;                                                 // dangling where you can see it
      if(waiting) to=c.mode==='short' ? BASKET_UP : ahead<55 ? BASKET_DOWN : to;
      else if(c.state==='thanks') to=c.t<1.5 ? BASKET_DOWN : BASKET_UP+0.5; // loaded: haul it up

      c.basket.position.y=c.basketY;
      c.rope.scale.y=Math.max(0.1,5.7-c.basketY-0.75);

      c.swing+=c.swingV*dt;

      c.basket.position.z=-0.7-Math.sin(c.swing*0.4)*c.rope.scale.y;
      c.contents.forEach((m,i)=>{ m.visible=c.state==='thanks' && c.t>0.45+i*0.12; });
      if(Math.abs(step)>1e-4) c.rg.arms.forEach((a,i)=>{ a.rotation.x=-1.4+Math.sin(t*8+i*Math.PI)*0.55; a.rotation.z=0; });   // hand over hand on the rope
    } else if(c.kind==='ahwa'){

        let to=0.15;                                                         // hand on the lap
        if(asking && ahead<60) to=1.15+Math.sin(t*(here?9:4)+i*1.7)*0.22;    // all pointing at the spot

function bayIsClear(cz, side, type){
  if(type===DROPS.home && [-1.5,0,1.5].some(dz=>WALL_OCC.has(side+':'+Math.round((cz+dz)/3)))) return false;   // the balcony needs a free stretch of wall
  if(nearAlley(cz,Math.max(type.l/2,type.front))) return false;
  const cx=side*(RH(cz)-type.w/2);
  return !obstacles.some(o=>['stall','stander','crate','parkedCart','parkedCar'].includes(o.kind) &&
    Math.abs(o.mesh.position.z-cz)<type.l/2+o.hz && Math.abs(o.mesh.position.x-cx)<type.w/2+o.hx);
}

  const sand=0xb9a88c, concrete=0xb0a898, broken=0x8e867a;
  p.push(part(new THREE.CylinderGeometry(up?0.8:0.56,up?0.84:0.6,0.016,18),0,0.012,0,up?sand:0x5d574f));   // dusty, patched road round it
  if(up){
    for(let i=0;i<14;i++){
      const a=i/14*Math.PI*2;
      if(i%6===4){                                                          // where the collar has broken away
        for(let k=0;k<4;k++) p.push(B(rnd(0.06,0.15),rnd(0.05,0.1),rnd(0.06,0.14),Math.sin(a)*rnd(0.55,0.85),0.04,Math.cos(a)*rnd(0.55,0.85),broken,0,rnd(0,3)));
        continue;
      }
      p.push(B(0.27,rnd(0.11,0.14),0.17,Math.sin(a)*0.56,0.065,Math.cos(a)*0.56,i%2?concrete:0xa39c8f,0,a),
             B(0.31,0.05,0.14,Math.sin(a)*0.68,0.025,Math.cos(a)*0.68,broken,0,a));        // cracked lower lip
    }
    p.push(part(new THREE.CylinderGeometry(0.5,0.52,0.08,18),0,0.05,0,0x4a4744));
  } else {
    for(let i=0;i<9;i++){ const a=rnd(0,6.28); p.push(B(rnd(0.04,0.1),0.015,rnd(0.04,0.1),Math.sin(a)*0.57,0.022,Math.cos(a)*0.57,sand,0,rnd(0,3))); }   // grit in the rim
  }
  g.add(mergeParts(p));
  const lid=new THREE.Mesh(coverGeo,coverMat);
  lid.rotation.set(-Math.PI/2,0,rnd(0,Math.PI*2)); lid.position.y=up?0.135:0.028; lid.receiveShadow=true; g.add(lid);
  return {g,lid};
}
function makeOpenHole(){
  // open drain, flagged the Cairo way: a carved chair frame and a tyre stuck in it, rubbish beside
  const p=[], wood=0xb07f35, gold=0xc9983f;
  p.push(part(new THREE.CylinderGeometry(0.7,0.74,0.016,16),0,0.012,0,0xa89a84), part(new THREE.CylinderGeometry(0.52,0.52,0.02,16),0,0.022,0,0x080706));
  for(let i=0;i<11;i++){ const a=i/11*Math.PI*2; p.push(B(rnd(0.12,0.24),0.05,0.1,Math.sin(a)*0.56,0.035,Math.cos(a)*0.56,0x77736b,0,a)); }
  for(const rz of [-0.3,0.3]){
    p.push(B(0.5,0.09,0.08,-0.22,0.19,rz,wood,0,0,-0.3), B(0.5,0.09,0.08,0.22,0.19,rz,wood,0,0,0.3));   // curved rail
    for(const sx of [-1,1]){
      p.push(B(0.09,0.55,0.08,sx*0.5,0.42,rz,gold,0,0,-sx*0.2),
        part(new THREE.TorusGeometry(0.08,0.035,5,9),sx*0.56,0.71,rz,gold));                           // scrolled ends
    }
  }
  for(const sx of [-0.47,0.47]) p.push(B(0.07,0.07,0.64,sx,0.28,0,wood));
  p.push(part(new THREE.TorusGeometry(0.31,0.13,7,16),0.12,0.52,0,0x1b1b1b,0.18,0.5,0), B(0.5,0.02,0.4,-0.2,0.1,0.05,0x9c7b52,0.2,0.4,0.15));
  for(let i=0;i<16;i++) p.push(B(rnd(0.08,0.18),rnd(0.02,0.07),rnd(0.07,0.15),rnd(-0.8,0.8),0.04,rnd(0.55,0.95),pick([0xe8e2d2,0x457b9d,0xc9a86a,0x777777,0xd62828]),0,rnd(0,3)));
  const g=new THREE.Group(); g.add(mergeParts(p)); return g;
}

function spawnBumps(){
  for(const b of bumps) scene.remove(b.g);
  bumps=[]; hopY=hopV=0;
  const fixed=['stall','stander','crate','parkedCart','parkedCar','openHole'];
  for(let next=rnd(25,40); next<SHOP_Z-10; next+=tr(TUNE.roadBumpEvery)){   // fewer: one every ~50 m
    for(let a=0;a<10;a++){
      const r=Math.random(), bz=next+rnd(-4,4);
      // the open drain with the tyre goes only where the street is open: no parked cars, carts, stalls or crates
      // nearby, not much else going on, and not a narrow stretch
      const quiet = RH(bz)>=ROAD_HALF-0.1
        && !obstacles.some(o=>['parkedCar','parkedCart','stall','crate','stander'].includes(o.kind) && Math.abs(o.mesh.position.z-bz)<7)
        && obstacles.filter(o=>Math.abs((o.planZ??o.mesh.position.z)-bz)<7).length<2;
      const kind=r<0.4?'raised':r<0.78||!quiet?'flat':'open', lim=RH(bz)-(kind==='open'?1.1:0.95);
      let bx=Math.max(-lim,Math.min(lim,(rnd(-1,1)+rnd(-1,1))/2*lim*1.5));                            // mostly out in the riding line
      if(kind==='open'){
        // carts only go forward in a straight line, so the lane of every cart behind this spot must stay clear
        const lanes=obstacles.filter(o=>o.cart && o.mesh.position.z-o.hz<bz+0.55).map(o=>[o.mesh.position.x,o.hx+0.6+0.2]);
        const clear=at=>lanes.every(([lane,need])=>Math.abs(at-lane)>=need);
        if(!clear(bx)){
          const free=[];
          for(let at=-lim;at<=lim;at+=0.1) if(clear(at)) free.push(at);
          if(!free.length) continue;                       // no room here: try another spot
          bx=pick(free);
        }
      }
      if(customers.some(c=>Math.abs(c.z-bz)<c.type.l/2+1)) continue;                                  // not in a delivery bay
      if(obstacles.some(o=>fixed.includes(o.kind) && Math.abs(o.mesh.position.z-bz)<o.hz+0.8 && Math.abs(o.mesh.position.x-bx)<o.hx+0.8)) continue;
      if(kind==='open'){
        // solid: people walk round it, and riding into it follows the normal hit rules
        const o={kind:'openHole',mesh:makeOpenHole(),hx:0.6,hz:0.55,w:1.2,d:1.1,vx:0,vz:0,t:0,state:0};
        o.mesh.position.set(bx,0,bz);
        if(overlapsAny(o) || freeGap(o,3)<MIN_PASS) continue;
        o.planZ=bz; obstacles.push(o); scene.add(o.mesh);
      } else {
        const {g,lid}=makeBump(kind);
        g.position.set(bx,0,bz); scene.add(g);
        bumps.push({...BUMP_KINDS[kind],g,lid,lidY:lid.position.y,x:bx,z:bz,wheels:[false,false],rattle:0});
      }
      break;
    }
  }
}
function groundAt(gx,gz){
  let h=0;
  for(const b of bumps){
    if(Math.abs(gz-b.z)>b.r) continue;
    const d=Math.hypot(gx-b.x,gz-b.z)/b.r;
    if(d<1) h+=b.h*Math.min(1,(1-d)*2.5);
  }
  return h;
}
function rideOverBumps(dt){
  const v=Math.abs(speed);
  for(const b of bumps){
    [WHEELBASE/2,-WHEELBASE/2].forEach((off,i)=>{
      const wz=z+off, span=Math.abs(speed*dt);                   // swept over this frame, so top speed can't skip one
      const on=Math.abs(x-b.x)<b.r+0.03 && Math.hypot(x-b.x,Math.max(0,Math.abs(wz-b.z)-span/2))<b.r+0.03;
      if(on && !b.wheels[i] && v>0.3){
        b.rattle=Math.max(b.rattle,Math.min(1,v/10));
        hopV=Math.max(hopV,Math.min(3,b.jolt*v*(i?0.13:0.17)));   // kicked off the ground
        joints.dive.v+=(i?-1:1)*Math.min(3,v*0.18)*b.jolt;
        joints.trayX.v+=(i?-1:1)*Math.min(2.5,v*0.14)*b.jolt;
        joints.trayZ.v+=(x-b.x)*Math.min(3,v*0.2)*b.jolt;
        joints.steer.v+=(x>=b.x?1:-1)*Math.min(3,v*0.15)*b.jolt;
        if(i===0){                                               // bread is lost once, as the front wheel hits
          const lost=Math.min(loaves.length,roadBumpLoss(v,b.jolt));
          lossTag='road bump'; for(let k=0;k<lost;k++) dropLoaf(Math.random()<.5?-1:1,vx,speed*0.85);
          if(lost) toast(`مطب! −${lost} 🍞`);
        }
      }
      b.wheels[i]=on;
    });
    if(b.rattle>0){
      b.rattle=Math.max(0,b.rattle-dt*1.5);
      b.lid.position.y=b.lidY+Math.abs(Math.sin(b.rattle*35))*b.rattle*0.035;
    }
  }
  if(hopY>0 || hopV>0){
    hopV-=G*dt; hopY+=hopV*dt;
    if(hopY<=0){ hopY=0; if(hopV<-0.8) joints.bounce.v+=hopV*0.25; hopV=0; }   // lands, rider's knees take it
  }
}

  let loaded=null, last=null;
  setInterval(async()=>{
    try{
      const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
      if(!r.ok) return;
      const now=r.headers.get('last-modified')+'|'+r.headers.get('content-length');
